
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>404 - Page Not Found | PS Web Studio</title>

    <meta name="description" content="The page you're looking for could not be found. Visit PS Web Studio to explore our website development services.">
    <meta name="robots" content="noindex, follow">
    <meta name="author" content="PS Web Studio">

    <link rel="canonical" href="https://pswebstudio.netlify.app/404.html">

    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/img/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/all.min.css">
    <link rel="stylesheet" href="assets/css/animate.css">
    <link rel="stylesheet" href="assets/css/main.css">

    <style>
        .error-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
            background: #f8f8f8;
        }

        .error-content {
            max-width: 650px;
            width: 100%;
        }

        .error-number {
        font-size: clamp(110px, 22vw, 130px);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -3px;
        color: var(--ott-accent-2);
        margin-bottom: 20px;

        }

        .error-label {
          display: inline-block;
          padding: 8px 18px;
          background: rgb(221 232 253);
          color: #163e8e;
          border-radius: 30px;
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 2px;
          text-transform: uppercase;
          margin-bottom: 20px
        }

        .error-content h1 {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            color: #171717;
            margin-bottom: 18px;
        }

        .error-content p {
            font-size: 16px;
            line-height: 1.8;
            color: #666;
            max-width: 510px;
            margin: 0 auto 30px;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .error-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          padding: 10px 23px;
          border-radius: 5px;
          font-size: 14px;
          font-weight: 500;
          text-decoration: none;
          transition: all 0.3s ease;
        }

        .error-btn-primary {
          background: var(--bs-primary);
          color: #fff;
          }

        .error-btn-primary:hover {
            background: #171717;
            color: #fff;
        }

        .error-btn-secondary {
            border: 1px solid #ddd;
            color: #171717;
            background: #fff;
        }

        .error-btn-secondary:hover {
            border-color: #ac6e34;
            color: #ac6e34;
        }

        .error-footer {
            margin-top: 55px;
            font-size: 13px;
            color: #888;
        }

        .error-footer a {
            color: #163e8e;
            text-decoration: none;
        }

        @media (max-width: 575px) {
            .error-wrapper {
                padding: 60px 18px;
            }

            .error-number {
                letter-spacing: -6px;
            }

            .error-content p {
                font-size: 14px;
            }

            .error-actions {
                flex-direction: column;
            }

            .error-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="error-wrapper">
        <div class="error-content">

            <div class="error-number">404</div>

            <span class="error-label">Page Not Found</span>

            <h1>Oops! This Page Is Missing.</h1>

            <p>
                The page you're looking for may have been moved,
                deleted, or the link might be incorrect.
                Don't worry, let's get you back on track.
            </p>

            <div class="error-actions">
                <a href="index.html" class="error-btn error-btn-primary">
                    <i class="fa-solid fa-house"></i>
                    Back to Homepage
                </a>

                <a href="contact.html" class="error-btn error-btn-secondary">
                    <i class="fa-regular fa-envelope"></i>
                    Contact Us
                </a>
            </div>

            <div class="error-footer">
                <p>
                    © <span id="currentYear"></span>
                    <a href="index.html">PS Web Studio</a>.
                    All Rights Reserved.
                </p>
            </div>

        </div>
    </main>

    <script>
        document.getElementById("currentYear").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
