<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>PS Web Studio CMS · Admin</title>
    <link rel="icon" type="image/x-icon" href="../assets/img/favico/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Same tokens as the public project page, so admin and site feel like one product */
        :root {
            --theme: #0d9ce0;
            --theme-2: #163e8e;
            --pd-ink: #0f1b2d;
            --pd-body: #3c4758;
            --pd-muted: #637085;
            --pd-line: #dde4ee;
            --pd-page: #f3f6fa;
            --pd-card: #ffffff;
            --pd-accent: var(--theme);
            --pd-accent-dark: var(--theme-2);
            --pd-accent-soft: #e4f3fc;
            --pd-ok: #17794c;
            --pd-ok-soft: #e3f6ec;
            --pd-warn: #8a5a00;
            --pd-warn-soft: #fff3d6;
            --pd-danger: #c0362c;
            --ad-topbar: 64px;
            --ad-sidebar: 240px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--pd-page); color: var(--pd-ink); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        a { text-decoration: none; }
        :focus-visible { outline: 3px solid var(--pd-accent); outline-offset: 2px; }

        /* Top bar */
        .ad-topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 16px; height: var(--ad-topbar); padding: 0 24px; background: #fff; border-bottom: 1px solid var(--pd-line); }
        .ad-topbar img { height: 55px; width: auto; display: block; }
        .ad-user { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--pd-body); min-width: 0; }
        .ad-user span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ad-user i { color: var(--pd-accent); margin-right: 6px; }

        /* Shell */
        .ad-shell { display: grid; grid-template-columns: var(--ad-sidebar) minmax(0, 1fr); min-height: calc(100vh - var(--ad-topbar)); }
        .ad-sidebar { position: sticky; top: var(--ad-topbar); align-self: start; height: calc(100vh - var(--ad-topbar)); padding: 20px 14px; background: #fff; border-right: 1px solid var(--pd-line); }
        .ad-nav { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
        .ad-link { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: var(--pd-body); font-size: 15px; font-weight: 500; cursor: pointer; transition: background-color .15s, color .15s; }
        .ad-link i { width: 20px; text-align: center; color: var(--pd-muted); }
        .ad-link:hover { background: var(--pd-page); color: var(--pd-ink); }
        .ad-link.active { background: var(--pd-accent-soft); color: var(--pd-accent-dark); font-weight: 600; }
        .ad-link.active i { color: var(--pd-accent-dark); }
        .ad-nav-sep { height: 1px; margin: 12px 6px; background: var(--pd-line); }
        .ad-tabs { display: none; }
        .ad-content { min-width: 0; padding: 32px; }
        #content-area { min-height: 400px; max-width: 1200px; }

        /* Page header */
        .ad-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
        .ad-head h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
        .ad-head p { margin: 4px 0 0; font-size: 15px; color: var(--pd-muted); }

        /* Buttons (same as .pd-btn) */
        .ad-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border: 1px solid var(--pd-line); border-radius: 10px; background: #fff; color: var(--pd-ink); font-size: 14.5px; font-weight: 600; line-height: 1.2; cursor: pointer; transition: border-color .15s, background-color .15s, color .15s; }
        .ad-btn:hover { border-color: var(--pd-accent); color: var(--pd-accent-dark); }
        .ad-btn.primary { background: var(--pd-accent); border-color: var(--pd-accent); color: #fff; }
        .ad-btn.primary:hover { background: var(--pd-accent-dark); border-color: var(--pd-accent-dark); color: #fff; }
        .ad-btn.danger:hover { border-color: var(--pd-danger); color: var(--pd-danger); }
        .ad-btn.sm { padding: 7px 10px; font-size: 13.5px; border-radius: 8px; }
        .ad-btn:disabled { opacity: .6; cursor: not-allowed; }
        .logout-btn { border: 0; background: transparent; color: var(--pd-danger); font-weight: 600; cursor: pointer; white-space: nowrap; }
        .logout-btn:hover { text-decoration: underline; }

        /* Cards */
        .ad-card { border: 1px solid var(--pd-line); border-radius: 14px; background: var(--pd-card); }
        .ad-card-pad { padding: 22px 24px; }
        .ad-card h2 { margin: 0 0 14px; font-size: 18px; font-weight: 700; }

        .ad-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
        .ad-stat { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 22px; }
        .ad-stat small { display: block; margin-bottom: 4px; font-size: 14px; color: var(--pd-muted); }
        .ad-stat b { font-size: 32px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
        .ad-stat i { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--pd-accent-soft); color: var(--pd-accent-dark); font-size: 18px; }
        .ad-stat.ok i { background: var(--pd-ok-soft); color: var(--pd-ok); }
        .ad-stat.warn i { background: var(--pd-warn-soft); color: var(--pd-warn); }

        .ad-dash-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
        .ad-actions { display: grid; gap: 10px; }

        /* Table */
        .ad-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--pd-line); }
        .ad-search { position: relative; flex: 1; max-width: 340px; }
        .ad-search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--pd-muted); font-size: 13px; }
        .ad-search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--pd-line); border-radius: 10px; font-size: 14.5px; }
        .ad-search input:focus { border-color: var(--pd-accent); outline: none; box-shadow: 0 0 0 3px var(--pd-accent-soft); }
        .ad-count { font-size: 14px; color: var(--pd-muted); }
        .ad-scroll { overflow-x: auto; }
        .ad-table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 14.5px; }
        .ad-table th { padding: 12px 20px; background: #f8fafc; border-bottom: 1px solid var(--pd-line); text-align: left; font-size: 13.5px; font-weight: 600; color: var(--pd-muted); white-space: nowrap; }
        .ad-table td { padding: 14px 20px; border-bottom: 1px solid var(--pd-line); vertical-align: middle; color: var(--pd-body); }
        .ad-table tr:last-child td { border-bottom: 0; }
        .ad-table tbody tr:hover { background: #fafcfe; }
        .ad-table .actions { display: flex; justify-content: flex-end; gap: 6px; white-space: nowrap; }
        .ad-empty { padding: 48px 20px; text-align: center; color: var(--pd-muted); }
        .ad-empty i { display: block; margin-bottom: 10px; font-size: 26px; }

        .ad-proj { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .ad-thumb { flex: 0 0 auto; width: 72px; height: 45px; border-radius: 8px; background: #e9eef5 center top / cover no-repeat; border: 1px solid var(--pd-line); }
        .ad-proj strong { display: block; color: var(--pd-ink); font-weight: 600; }
        .ad-proj small { color: var(--pd-muted); }

        .ad-status { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--pd-ok-soft); color: var(--pd-ok); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
        .ad-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .ad-status.pending { background: var(--pd-warn-soft); color: var(--pd-warn); }

        .ad-switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .ad-switch input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
        .ad-switch span { position: absolute; inset: 0; border-radius: 999px; background: #c8d1de; transition: background-color .15s; }
        .ad-switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
        .ad-switch input:checked + span { background: var(--pd-accent); }
        .ad-switch input:checked + span::after { transform: translateX(18px); }
        .ad-switch input:focus-visible + span { outline: 3px solid var(--pd-accent); outline-offset: 2px; }

        .ad-list { margin: 0; padding: 0; list-style: none; }
        .ad-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--pd-line); }
        .ad-list li:last-child { border-bottom: 0; }

        /* Modal + form */
        .modal-content { border: 0; border-radius: 16px; }
        .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--pd-line); }
        .modal-title { font-weight: 700; }
        .modal-body { padding: 24px; background: var(--pd-page); }
        .modal-lg { max-width: 920px; }
        .ad-group { margin-bottom: 16px; padding: 20px; border: 1px solid var(--pd-line); border-radius: 12px; background: #fff; }
        .ad-group h3 { margin: 0 0 14px; font-size: 16px; font-weight: 700; }
        .ad-group .form-label { margin-bottom: 4px; font-size: 13.5px; font-weight: 600; color: var(--pd-body); }
        .ad-group .form-control, .ad-group .form-select { border-color: var(--pd-line); border-radius: 8px; font-size: 14.5px; }
        .ad-group .form-control:focus, .ad-group .form-select:focus { border-color: var(--pd-accent); box-shadow: 0 0 0 3px var(--pd-accent-soft); }
        .ad-hint { margin-top: 6px; font-size: 13px; color: var(--pd-muted); }
        .ad-form-foot { position: sticky; bottom: -24px; display: flex; justify-content: flex-end; gap: 10px; margin: 0 -24px -24px; padding: 14px 24px; background: #fff; border-top: 1px solid var(--pd-line); border-radius: 0 0 16px 16px; }

        .tag-container { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 44px; padding: 8px; border: 1px solid var(--pd-line); border-radius: 8px; background: #fff; }
        .tag-container:focus-within { border-color: var(--pd-accent); box-shadow: 0 0 0 3px var(--pd-accent-soft); }
        .tag-item { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 12px; border-radius: 999px; background: var(--pd-accent-soft); color: var(--pd-accent-dark); font-size: 13px; font-weight: 500; }
        .tag-item .remove-tag { display: grid; place-items: center; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: inherit; font-size: 15px; line-height: 1; cursor: pointer; }
        .tag-item .remove-tag:hover { background: var(--pd-accent-dark); color: #fff; }
        .tag-input { flex: 1; min-width: 140px; border: 0; outline: 0; background: transparent; font-size: 14px; }
        .ad-previews { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .ad-previews img { width: 104px; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border: 1px solid var(--pd-line); border-radius: 8px; background: #e9eef5; }

        /* Toast */
        .toast-notification { position: fixed; right: 20px; bottom: 20px; z-index: 9999; display: none; max-width: min(420px, calc(100vw - 40px)); padding: 14px 20px; border-radius: 12px; background: var(--pd-ok); color: #fff; font-size: 14.5px; font-weight: 500; box-shadow: 0 10px 30px rgba(15, 27, 45, .25); animation: slideIn .25s ease; }
        .toast-notification.error { background: var(--pd-danger); }
        @keyframes slideIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

        .loading-spinner { display: flex; justify-content: center; align-items: center; min-height: 300px; }

        @media (max-width: 1100px) {
            .ad-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .ad-dash-grid { grid-template-columns: minmax(0, 1fr); }
        }
        @media (max-width: 767px) {
            .ad-shell { grid-template-columns: minmax(0, 1fr); }
            .ad-sidebar { display: none; }
            .ad-tabs { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--pd-line); }
            .ad-tabs .ad-link { flex: 0 0 auto; padding: 8px 14px; white-space: nowrap; font-size: 14px; }
            .ad-topbar { padding: 0 16px; }
            .ad-content { padding: 20px 16px; }
            .ad-user .ad-email { display: none; }
            .ad-stats { grid-template-columns: minmax(0, 1fr); }
            .ad-head h1 { font-size: 24px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .ad-link, .ad-btn, .ad-switch span, .ad-switch span::after { transition: none; }
            .toast-notification { animation: none; }
        }
    </style>
</head>
<body>
    <header class="ad-topbar">
        <a href="#" aria-label="PS Web Studio admin"><img src="../assets/img/logo/psweb-logo.png" alt="PS Web Studio logo"></a>
        <div class="ad-user">
            <span class="ad-email" id="adminUser"><i class="fa-solid fa-circle-user"></i> Loading...</span>
            <button id="logoutBtn" class="logout-btn" type="button"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log out</button>
        </div>
    </header>

    <!-- Mobile section tabs -->
    <nav class="ad-tabs" aria-label="Sections (mobile)">
        <a class="ad-link active" data-section="dashboard" href="#"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a>
        <a class="ad-link" data-section="projects" href="#"><i class="fa-solid fa-diagram-project"></i> Projects</a>
        <a class="ad-link" data-section="blogs" href="#"><i class="fa-solid fa-blog"></i> Blogs</a>
        <a class="ad-link" data-section="services" href="#"><i class="fa-solid fa-gears"></i> Services</a>
        <a class="ad-link" data-section="testimonials" href="#"><i class="fa-regular fa-comment"></i> Testimonials</a>
    </nav>

    <div class="ad-shell">
        <aside class="ad-sidebar">
            <ul class="ad-nav" aria-label="Sections">
                <li><a class="ad-link active" data-section="dashboard" href="#"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a></li>
                <li><a class="ad-link" data-section="projects" href="#"><i class="fa-solid fa-diagram-project"></i> Projects</a></li>
                <li><a class="ad-link" data-section="blogs" href="#"><i class="fa-solid fa-blog"></i> Blogs</a></li>
                <li><a class="ad-link" data-section="services" href="#"><i class="fa-solid fa-gears"></i> Services</a></li>
                <li><a class="ad-link" data-section="testimonials" href="#"><i class="fa-regular fa-comment"></i> Testimonials</a></li>
                <li class="ad-nav-sep" aria-hidden="true"></li>
                <li><a class="ad-link" id="viewSiteLink" href="../" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> View site</a></li>
            </ul>
        </aside>

        <main class="ad-content">
            <div id="content-area">
                <div class="loading-spinner"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="modalTitle">Add new</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>
    </div>

    <div class="toast-notification" id="toast" role="status" aria-live="polite"><i class="fa-solid fa-circle-check me-2"></i><span id="toastMessage">Saved</span></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm';

        // The anon key is public by design. Safety comes from Row Level Security on the tables,
        // which must allow writes only for authenticated users.
        const supabaseUrl = 'https://jerlrkqevhevulupcowu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Implcmxya3FldmhldnVsdXBjb3d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODgyODksImV4cCI6MjEwMTc2NDI4OX0.VBKZPlgv9LiSJttmP0pI4QG-3eRPqDKnU9fyp-SvRLg';

        const supabase = createClient(supabaseUrl, supabaseKey);
        const IMG_BASE = '../assets/img/project-banner/';
        const imgUrl = (f) => IMG_BASE + encodeURI(f);

        let modalInstance = null;
        let currentProjectId = null;
        let currentBlogId = null;
        let projectsCache = [];
        let blogsCache = [];

        /* ---------- helpers ---------- */
        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        const slugify = (s) => String(s || '').trim().toLowerCase()
            .replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, '');

        let toastTimer;
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.className = 'toast-notification' + (type === 'error' ? ' error' : '');
            toast.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 3500);
        }

        function getAdminUrl(page) {
            const p = window.location.pathname;
            const idx = p.lastIndexOf('/admin');
            return idx !== -1 ? p.substring(0, idx) + '/admin/' + page : page;
        }
        function getSiteUrl() {
            const p = window.location.pathname;
            const idx = p.lastIndexOf('/admin');
            if (idx !== -1) {
                const root = p.substring(0, idx);
                return root ? root + '/' : '/';
            }
            return '../';
        }

        /* ---------- auth ---------- */
        async function checkAuth() {
            try {
                const { data } = await supabase.auth.getSession();
                if (!data.session) { window.location.href = getAdminUrl('login.html'); return false; }
                const { data: userData } = await supabase.auth.getUser();
                if (userData?.user) {
                    document.getElementById('adminUser').innerHTML =
                        `<i class="fa-solid fa-circle-user"></i>${escapeHtml(userData.user.email)}`;
                }
                const viewSite = document.getElementById('viewSiteLink');
                if (viewSite) viewSite.href = getSiteUrl();
                return true;
            } catch (error) {
                window.location.href = getAdminUrl('login.html');
                return false;
            }
        }
        supabase.auth.onAuthStateChange((event) => {
            if (event === 'SIGNED_OUT') window.location.href = getAdminUrl('login.html');
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (confirm('Log out of the admin panel?')) {
                await supabase.auth.signOut();
                window.location.href = getAdminUrl('login.html');
            }
        });

        /* ---------- navigation ---------- */
        document.querySelectorAll('[data-section]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                goto(link.dataset.section);
            });
        });
        function goto(section) {
            document.querySelectorAll('[data-section]').forEach(l => l.classList.toggle('active', l.dataset.section === section));
            loadSection(section);
        }

        const comingSoon = (name) => `
            <div class="ad-head"><div><h1>${name}</h1><p>Management for this section is not built yet.</p></div></div>
            <div class="ad-card ad-empty"><i class="fa-regular fa-clock"></i>Coming soon</div>`;

        async function loadSection(section) {
            const area = document.getElementById('content-area');
            area.innerHTML = `<div class="loading-spinner"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>`;
            try {
                switch (section) {
                    case 'dashboard': area.innerHTML = await getDashboardHTML(); break;
                    case 'projects': area.innerHTML = await getProjectsHTML(); bindProjectSearch(); break;
                    case 'blogs': area.innerHTML = await getBlogsHTML(); break;
                    case 'services': area.innerHTML = comingSoon('Services'); break;
                    case 'testimonials': area.innerHTML = comingSoon('Testimonials'); break;
                    default: area.innerHTML = `<div class="ad-empty">Select a section from the sidebar.</div>`;
                }
            } catch (error) {
                area.innerHTML = `<div class="alert alert-danger">Couldn't load this section: ${escapeHtml(error.message)}</div>`;
            }
        }

        /* One click handler for every button in the content area */
        document.getElementById('content-area').addEventListener('click', (e) => {
            const el = e.target.closest('[data-action]');
            if (!el) return;
            const { action, id, section } = el.dataset;
            if (action === 'goto') { e.preventDefault(); goto(section); }
            if (action === 'new-project') openProjectForm();
            if (action === 'edit-project') openProjectForm(id);
            if (action === 'delete-project') deleteProject(id);
            if (action === 'new-blog') openBlogForm();
            if (action === 'edit-blog') openBlogForm(id);
            if (action === 'delete-blog') deleteBlog(id);
        });
        document.getElementById('content-area').addEventListener('change', async (e) => {
            const sw = e.target.closest('[data-toggle-project]');
            if (!sw) return;
            const enabled = sw.checked;
            const { error } = await supabase.from('projects').update({ is_enabled: enabled }).eq('id', sw.dataset.toggleProject);
            if (error) {
                sw.checked = !enabled;
                showToast('Could not change visibility: ' + error.message, 'error');
            } else {
                showToast(enabled ? 'Project is now visible on the site' : 'Project hidden from the site');
            }
        });

        /* ---------- dashboard ---------- */
        async function getDashboardHTML() {
            const count = (table, filter) => {
                let q = supabase.from(table).select('*', { count: 'exact', head: true });

        const tagHTML = (t) => `<span class="tag-item" data-value="${escapeHtml(t)}">${escapeHtml(t)}<button type="button" class="remove-tag" aria-label="Remove ${escapeHtml(t)}">&times;</button></span>`;
        const tagField = (id, items, placeholder) => `
            <div class="tag-container" id="${id}_container">
                ${(items || []).map(tagHTML).join('')}
                <input type="text" class="tag-input" id="${id}_input" placeholder="${placeholder}" aria-label="${placeholder}">
            </div>`;
        const getTags = (id) => [...document.querySelectorAll(`#${id}_container .tag-item`)].map(el => el.dataset.value);

        function addTag(id, raw) {
            const val = raw.trim();
            if (!val || getTags(id).includes(val)) return false;
            const container = document.getElementById(`${id}_container`);
            const input = document.getElementById(`${id}_input`);
            input.insertAdjacentHTML('beforebegin', tagHTML(val));
            return true;
        }
        function setupTagField(id, onChange) {
            const container = document.getElementById(`${id}_container`);
            const input = document.getElementById(`${id}_input`);
            const commit = () => { if (addTag(id, input.value)) onChange?.(); input.value = ''; };
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); commit(); }
                if (e.key === 'Backspace' && !input.value) {
                    const last = container.querySelector('.tag-item:last-of-type');
                    if (last) { last.remove(); onChange?.(); }
                }
            });
            input.addEventListener('blur', commit);   // text typed but not confirmed is kept, not lost
            container.addEventListener('click', (e) => {
                const btn = e.target.closest('.remove-tag');
                if (btn) { btn.parentElement.remove(); onChange?.(); }
                else input.focus();
            });
        }
        const commitPending = (id) => { const i = document.getElementById(`${id}_input`); if (i && addTag(id, i.value)) i.value = ''; };

                const titleVal = titleInput.value.trim();
                const slug = slugify(slugInput.value || titleVal);
                if (!titleVal) { showToast('Title is required', 'error'); titleInput.focus(); return; }
                if (!slug) { showToast('Slug cannot be empty', 'error'); slugInput.focus(); return; }

                const data = {
                    title: titleVal,
                    slug,
                    category: document.getElementById('b_category').value.trim(),
                    author: document.getElementById('b_author').value.trim(),
                    date: document.getElementById('b_date').value.trim(),
                    comments: parseInt(document.getElementById('b_comments').value, 10) || 0,
                    image: document.getElementById('b_image').value.trim(),
                    excerpt: document.getElementById('b_excerpt').value.trim(),
                    content: document.getElementById('b_content').value,
                    tags: getTags('b_tags')
                };

                const saveBtn = document.getElementById('blogSave');
                saveBtn.disabled = true;
                try {
                    const result = currentBlogId
                        ? await supabase.from('blogs').update(data).eq('id', currentBlogId)
                        : await supabase.from('blogs').insert([data]);
                    if (result.error) throw result.error;

                    showToast(currentBlogId ? 'Post updated' : 'Post added');
                    bootstrap.Modal.getInstance(modal).hide();
                    loadSection('blogs');
                } catch (error) {
                    console.error('Save error:', error);
                    showToast(error.code === '23505' ? 'That slug is already used by another post' : 'Could not save: ' + error.message, 'error');
                } finally {
                    saveBtn.disabled = false;
                }
            };

            if (!modalInstance) modalInstance = new bootstrap.Modal(modal);
            modalInstance.show();
        }

        async function deleteBlog(id) {
            const b = blogsCache.find(x => String(x.id) === String(id));
            if (!confirm(`Delete "${b?.title || 'this post'}"? This cannot be undone.`)) return;
            const { error } = await supabase.from('blogs').delete().eq('id', id);
            if (error) { showToast('Could not delete: ' + error.message, 'error'); return; }
            showToast('Post deleted');
            loadSection('blogs');
        }

        /* ---------- start ---------- */
        const isAuth = await checkAuth();
        if (isAuth) loadSection('dashboard');
    </script>
</body>
</html>
