<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSWeb Studio - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
            margin: 20px;
        }
        .login-card h2 {
            color: #1a1a2e;
            font-weight: 700;
            margin-bottom: 4px;
            text-align: center;
            font-size: 28px;
        }
        .login-card .brand {
            color: #0d6efd;
        }
        .login-card .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .login-card .form-label {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        .login-card .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .login-card .form-control:focus {
            border-color: #0d9ce1;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        .login-card .btn-primary {
            width: 100%;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            font-size: 16px;
            background-color: #0d9ce1;
        }
        .login-card .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .alert {
            display: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: #0d6efd;
        }
        .login-footer {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #35647a;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo mb-3">
            <a href="#" class="header-logo">
                <img src="../assets/img/logo/psweb-logo.png" alt="PS Web Studio logo">
            </a>
        </div>

        <div id="errorAlert" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i> <span id="errorMessage">Invalid credentials. Please try again.</span>
        </div>

        <div id="successAlert" class="alert alert-success">
            <i class="fas fa-check-circle"></i> Login successful! Redirecting...
        </div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email"
                       placeholder="admin@pswebstudio.com"
                       autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password"
                       placeholder="Enter your password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <i class="fas fa-sign-in-alt me-2"></i> Sign In
            </button>
        </form>

        <div id="statusMessage" class="text-center mt-3"></div>

        <a href="../" class="back-link" id="backToSiteLink">
            <i class="fas fa-arrow-left me-2"></i> Back to Website
        </a>
        <div class="login-footer">© 2026 PS Web Studio. All rights reserved.</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm"
        }
    }
    </script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm';

        const supabaseUrl = 'https://jerlrkqevhevulupcowu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Implcmxya3FldmhldnVsdXBjb3d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODgyODksImV4cCI6MjEwMTc2NDI4OX0.VBKZPlgv9LiSJttmP0pI4QG-3eRPqDKnU9fyp-SvRLg';

        const supabase = createClient(supabaseUrl, supabaseKey);

        
        function getAdminUrl(page) {
            const p = window.location.pathname;
            const idx = p.lastIndexOf('/admin');
            if (idx !== -1) {
                return p.substring(0, idx) + '/admin/' + page;
            }
            return page;
        }

        function getSiteUrl() {
            const p = window.location.pathname;
            const idx = p.lastIndexOf('/admin');
            if (idx !== -1) {
                const root = p.substring(0, idx);
                return root ? root + '/' : '/';
            }
            return '../';
        }

        const form = document.getElementById('loginForm');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const errorMessage = document.getElementById('errorMessage');
        const statusMessage = document.getElementById('statusMessage');
        const loginBtn = document.getElementById('loginBtn');

        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';

        async function checkSession() {
            try {
                const { data } = await supabase.auth.getSession();
                if (data.session) {
                    // ✅ FIXED: Redirect to the correct admin path
                    window.location.href = getAdminUrl('index.html');
                }
            } catch (e) {
                console.log('Session check:', e.message);
            }
        }
        checkSession();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';
            statusMessage.innerHTML = '';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                errorMessage.textContent = 'Please enter both email and password.';
                errorAlert.style.display = 'block';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Signing in...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error;
                }

                successAlert.style.display = 'block';

                statusMessage.replaceChildren();
                const successBox = document.createElement('div');
                successBox.className = 'alert alert-success mt-2';
                const icon = document.createElement('i');
                icon.className = 'fas fa-check-circle';
                successBox.appendChild(icon);
                successBox.append(` Welcome ${data.user.email}!`);
                statusMessage.appendChild(successBox);

                // ✅ FIXED: Redirect to the correct admin path
                setTimeout(() => {
                    window.location.href = getAdminUrl('index.html');
                }, 1500);

            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || 'Invalid credentials. Please try again.';
                errorAlert.style.display = 'block';

                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Sign In';
            }
        });
    </script>
</body>
</html>
