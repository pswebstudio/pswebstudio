<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSWeb Studio - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
   <style>

/* =========================================
   LOGIN PAGE
========================================= */

body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 30px 15px;
    background:
        radial-gradient(ellipse at 15% 15%, rgba(13, 156, 224, 0.20), transparent 40%),
        radial-gradient(ellipse at 85% 85%, rgba(22, 62, 142, 0.35), transparent 40%),
        linear-gradient(135deg, #101b2d 0%, #142b48 50%, #101b2d 100%);
    font-family: "Inter Tight", "Segoe UI", system-ui, sans-serif;
    color: #151515;
}

/* Login Card */
.login-card {
    position: relative;
    width: 100%;
    max-width: 430px;
    margin: 20px;
    padding: 42px 38px;
    overflow: hidden;
    background: #ffffff;
    border-radius: 20px;
    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.22),
        0 5px 20px rgba(0, 0, 0, 0.06);
    animation: loginCardIn 0.55s ease both;
}
.header-logo img{
  height: 70px;
  object-fit: cover;}

.logo{
  text-align: center;
}

/* Heading */
.login-card h2 {
    margin: 0 0 8px;
    color: #151515;
    font-size: 29px;
    font-weight: 800;
    line-height: 1.2;
    text-align: center;
    letter-spacing: -0.5px;
}

.login-card .brand {
    color: #0d9ce0;
}

.login-card .subtitle {
    margin: 0 0 32px;
    color: #696969;
    font-size: 14px;
    line-height: 1.6;
    text-align: center;
}

/* Form Labels */
.login-card .form-label {
    display: block;
    margin-bottom: 8px;
    color: #303b49;
    font-size: 13px;
    font-weight: 700;
}

/* Input Fields */
.login-card .form-control {
    width: 100%;
    min-height: 48px;
    padding: 12px 15px;
    border: 1px solid #dce2e9;
    border-radius: 10px;
    background: #f9fafc;
    color: #151515;
    font-family: inherit;
    font-size: 14px;
    transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
}

.login-card .form-control:hover {
    border-color: #b8c9d8;
    background: #ffffff;
}

.login-card .form-control:focus {
    border-color: #0d9ce0;
    background: #ffffff;
    outline: none;
    box-shadow: 0 0 0 4px rgba(13, 156, 224, 0.11);
}

.login-card .form-control::placeholder {
    color: #a0a9b4;
    font-size: 13px;
}

/* Login Button */
.login-card .btn-primary {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 49px;
    padding: 12px 20px;
    margin-top: 8px;
    overflow: hidden;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #0d9ce0, #163e8e);
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    box-shadow: 0 6px 16px rgba(13, 156, 224, 0.20);
    transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
}

.login-card .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(13, 156, 224, 0.30);
    filter: brightness(1.05);
}

.login-card .btn-primary:active:not(:disabled) {
    transform: translateY(0);
}

.login-card .btn-primary:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    box-shadow: none;
}

/* Alerts */
.login-card .alert {
    display: none;
    padding: 12px 15px;
    margin-bottom: 18px;
    border: 1px solid transparent;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
}

.login-card .alert-danger {
    background: #fff1f0;
    border-color: #ffd6d2;
    color: #b42318;
}

.login-card .alert-success {
    background: #ecfdf3;
    border-color: #b7ebc6;
    color: #187443;
}

.login-card .alert-warning {
    background: #fff8e6;
    border-color: #ffe2a8;
    color: #946200;
}

/* Back Link */
.login-card .back-link {
    display: block;
    margin-top: 22px;
    color: #696969;
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    text-decoration: none;
    transition: color 0.2s ease;
}

.login-card .back-link:hover {
    color: #0d9ce0;
}

.login-card .back-link i {
    margin-right: 5px;
}

/* Footer */
.login-card .login-footer {
    margin-top: 25px;
    padding-top: 18px;
    border-top: 1px solid #edf0f3;
    color: #8a96a3;
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
}

/* Animation */
@keyframes loginCardIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Accessibility */
.login-card a:focus-visible,
.login-card button:focus-visible,
.login-card input:focus-visible {
    outline: 2px solid #0d9ce0;
    outline-offset: 3px;
}

/* Responsive */
@media (max-width: 576px) {
    body {
        padding: 18px 12px;
    }

    .login-card {
        max-width: 100%;
        margin: 0;
        padding: 34px 24px;
        border-radius: 16px;
    }

    .login-card h2 {
        font-size: 25px;
    }

    .login-card .subtitle {
        margin-bottom: 26px;
    }
}

@media (max-width: 360px) {
    .login-card {
        padding: 30px 19px;
    }

    .login-card h2 {
        font-size: 23px;
    }
}

/* Reduced Motion */
@media (prefers-reduced-motion: reduce) {
    .login-card,
    .login-card *,
    .login-card *::before,
    .login-card *::after {
        animation: none !important;
        transition: none !important;
    }

    .login-card .btn-primary:hover {
        transform: none;
    }
}

   </style>
</head>
<body>
    <div class="login-card">
        <div class="logo mb-3">
            <a href="#" class="header-logo">
                <img src="../assets/img/logo/psweb-logo.png" alt="PS Web Studio logo">
            </a>
        </div>

        <div id="errorAlert" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i> <span id="errorMessage">Invalid credentials. Please try again.</span>
        </div>

        <div id="successAlert" class="alert alert-success">
            <i class="fas fa-check-circle"></i> Login successful! Redirecting...
        </div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email"
                       placeholder="admin@pswebstudio.com"
                       autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password"
                       placeholder="Enter your password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <i class="fas fa-sign-in-alt me-2"></i> Sign In
            </button>
        </form>

        <div id="statusMessage" class="text-center mt-3"></div>

        <a href="../" class="back-link" id="backToSiteLink">
            <i class="fas fa-arrow-left me-2"></i> Back to Website
        </a>
        <div class="login-footer">© 2026 PS Web Studio. All rights reserved.</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm"
        }
    }
    </script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm';

        const supabaseUrl = 'https://jerlrkqevhevulupcowu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Implcmxya3FldmhldnVsdXBjb3d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODgyODksImV4cCI6MjEwMTc2NDI4OX0.VBKZPlgv9LiSJttmP0pI4QG-3eRPqDKnU9fyp-SvRLg';

        const supabase = createClient(supabaseUrl, supabaseKey);


        function getAdminUrl(page) {
            const p = window.location.pathname;
            const idx = p.lastIndexOf('/admin');
            if (idx !== -1) {
                return p.substring(0, idx) + '/admin/' + page;
            }
            return page;
        }

        function getSiteUrl() {
            const p = window.location.pathname;
            const idx = p.lastIndexOf('/admin');
            if (idx !== -1) {
                const root = p.substring(0, idx);
                return root ? root + '/' : '/';
            }
            return '../';
        }

        const form = document.getElementById('loginForm');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const errorMessage = document.getElementById('errorMessage');
        const statusMessage = document.getElementById('statusMessage');
        const loginBtn = document.getElementById('loginBtn');

        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';

        async function checkSession() {
            try {
                const { data } = await supabase.auth.getSession();
                if (data.session) {
                    // ✅ FIXED: Redirect to the correct admin path
                    window.location.href = getAdminUrl('index.html');
                }
            } catch (e) {
                console.log('Session check:', e.message);
            }
        }
        checkSession();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';
            statusMessage.innerHTML = '';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                errorMessage.textContent = 'Please enter both email and password.';
                errorAlert.style.display = 'block';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Signing in...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error;
                }

                successAlert.style.display = 'block';

                statusMessage.replaceChildren();
                const successBox = document.createElement('div');
                successBox.className = 'alert alert-success mt-2';
                const icon = document.createElement('i');
                icon.className = 'fas fa-check-circle';
                successBox.appendChild(icon);
                successBox.append(` Welcome ${data.user.email}!`);
                statusMessage.appendChild(successBox);

                // ✅ FIXED: Redirect to the correct admin path
                setTimeout(() => {
                    window.location.href = getAdminUrl('index.html');
                }, 1500);

            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || 'Invalid credentials. Please try again.';
                errorAlert.style.display = 'block';

                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Sign In';
            }
        });
    </script>
</body>
</html>
