# netlify.toml
[build]
  publish = "."

[[redirects]]
  from = "/project/*"
  to = "project.html?project=:splat"
  status = 200

# Handle 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  [build]
  publish = "."

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"